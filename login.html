<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | System Analyst Growth Track</title><link rel="stylesheet" href="auth.css"></head><body><main class="authShell"><section class="authCard"><div class="brandMark">SA</div><h1>System Analyst Growth Track</h1><p class="sub">سجل دخولك عشان تحفظ تقدمك وتكمل من أي جهاز.</p><div class="tabs"><button class="tab active" data-mode="login">تسجيل الدخول</button><button class="tab" data-mode="signup">إنشاء حساب</button></div><form id="authForm"><div class="field" id="nameField" hidden><label>الاسم</label><input id="displayName" type="text" autocomplete="name" placeholder="اسمك"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••"></div><button class="submit" id="submitBtn" type="submit">دخول</button><p class="msg" id="msg"></p></form><p class="note">بيانات الدخول محفوظة وآمنة عبر Supabase Auth.</p></section></main><script type="module" src="login.js"></script></body></html>
